name: TestFlight
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.2)'
        required: true
        default: '0.1.2'
      apple_team_id:
        description: 'Optional 10-character Team ID; otherwise APPLE_TEAM_ID Variable/Secret'
        required: false
        type: string
env:
  FASTLANE_OPT_OUT_USAGE: '1'
  FASTLANE_SKIP_UPDATE_CHECK: '1'
permissions:
  contents: read
concurrency:
  group: apple-release
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.3'
          bundler: '2.5.23'
      - name: Validate fastlane without any Apple credentials
        run: |
          bundle config set path vendor/bundle
          bundle config set frozen true
          bundle install --jobs 4
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_sudoku.py
          bundle exec ruby tests/signing_config_test.rb
          bundle exec ruby tests/signing_asset_verifier_test.rb
          bundle exec ruby tests/release_pipeline_test.rb
          bundle exec ruby tests/archive_session_test.rb
          bundle exec ruby tests/apple_api_diagnostics_test.rb
          bundle exec ruby tests/jwt_comparison_test.rb
          bundle exec ruby tests/workflow_config_test.rb
          ruby -c fastlane/Fastfile
          bundle exec fastlane lanes
          cat Gemfile.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dependency-lock
          path: Gemfile.lock
          if-no-files-found: error
  upload:
    needs: preflight
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: testflight
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ inputs.apple_team_id || vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      SIGNING_REPO_PAT: ${{ secrets.SIGNING_REPO_PAT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check signing configuration without printing secrets
        run: python3 scripts/check_release_secrets.py --signing --trusted-dispatch --check-repo
      - run: bash scripts/select_xcode.sh
      - uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.3'
          bundler: '2.5.23'
      - name: Install pinned fastlane
        run: |
          bundle config set path vendor/bundle
          bundle config set frozen true
          bundle install --jobs 4
      - name: Restore match readonly assets, archive and upload safely
        run: python3 scripts/run_signing_lane.py beta
      - name: Preserve build provenance (no signing files or IPA)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testflight-provenance
          path: build/release/provenance.txt
          if-no-files-found: error
